# iso-obs: the Reliability Studio Python SDK.
#
# Tool configuration (ruff, black, mypy, pytest) is intentionally NOT repeated
# here: the repo-root pyproject.toml carries the shared config for every
# workspace member.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iso-obs"
version = "0.1.0"
description = "Python SDK for Reliability Studio (Iso AI)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Iso AI" }]
keywords = ["reliability", "observability", "evaluation", "robotics", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "iso-obs-schemas>=0.1,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcap = ["mcap>=1.4,<2"]
mcap-ros2 = ["mcap>=1.4,<2", "mcap-ros2-support>=0.5.7,<0.6"]
parquet = ["pyarrow>=16"]
rosbag2 = ["mcap>=1.4,<2", "mcap-ros2-support>=0.5.7,<0.6", "pyyaml>=6,<7"]

[project.urls]
Homepage = "https://iso-obs.com"
Documentation = "https://iso-obs.com/docs/sdk"
Repository = "https://github.com/iso-ai/iso-obs"
Issues = "https://github.com/iso-ai/iso-obs/issues"

[tool.uv.sources]
iso-obs-schemas = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/iso_obs"]

[tool.hatch.build.targets.sdist]
include = ["src/iso_obs", "README.md"]
