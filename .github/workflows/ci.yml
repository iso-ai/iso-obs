name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + type + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # Public CI must exercise every published integration. Without
      # --all-extras, rosbag2, MCAP, and Parquet tests either skip or test the
      # missing-dependency path instead of their real behavior.
      - name: Sync workspace with all published extras
        run: uv sync --all-packages --all-extras --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest
