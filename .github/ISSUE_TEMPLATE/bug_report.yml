name: Bug report
description: Report a defect in the Reliability Studio SDK, CLI, API, or web app.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        fields below so we can reproduce and triage the issue quickly.

        If this is a security vulnerability, do **not** file a public issue.
        Email security@iso-obs.com instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug and its impact.
      placeholder: When I run `iso run ...`, the process exits with ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        Minimal, self-contained steps or a code snippet that reproduces the
        problem. The smaller the repro, the faster we can help.
      placeholder: |
        1. Install `iso-obs==...`
        2. Run the following snippet ...
        3. Observe ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK / CLI / API version
      description: >
        Output of `iso --version` or the installed `iso-obs` / `iso-obs-cli`
        version. For the API, include the deployment or release identifier.
      placeholder: "iso-obs 0.4.2 / iso 0.4.2"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in "What happened?")
    validations:
      required: true
  - type: input
    id: environment-adapter
    attributes:
      label: Environment adapter
      description: >
        Which environment integration were you using (e.g. Gymnasium, MuJoCo,
        or a custom adapter)? Include the environment name and version.
      placeholder: "Gymnasium 1.0.0 / CartPole-v1"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and tracebacks
      description: >
        Paste any error output, stack traces, or log lines. This is
        automatically formatted as code, so no backticks are needed.
      render: shell
    validations:
      required: false
